version: '3.8'

services:
  options-signals-app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/signals"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s